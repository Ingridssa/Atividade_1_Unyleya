<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Conosco - Unybay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">Unybay</div>
    <nav class="nav-links">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="quem-somos.html" class="nav-btn">Quem Somos</a>
      <a href="#" class="nav-btn btn-entrar">Entrar</a>
    </nav>
  </header>

  <main class="container-form">
    <div class="form-card">
      <h2>Unybay</h2>
      <p class="form-subtitle">Fale Conosco através do formulário abaixo</p>

      <form>
        <div class="input-group">
          <input type="text" placeholder="Nome completo" required>
        </div>

        <div class="input-group">
          <input type="email" placeholder="E-mail" required>
        </div>

        <div class="input-group">
          <textarea placeholder="Escreva sua mensagem..." rows="5" required></textarea>
        </div>

        <button type="submit" class="btn-enviar">Enviar</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>Unylay Educacional | Todos os direitos reservados</p>
    <div class="footer-links">
      <a href="fale-conosco.html">Fale Conosco</a>
    </div>
  </footer>

</body>
</html>
